  <style>
    :root{--bg:#071426;--panel:#0c1e33;--panel2:#102943;--cyan:#66dcff;--blue:#5a9dff;--text:#f5f9ff;--muted:#a9bad0;--line:rgba(167,203,237,.16);--max:1160px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;line-height:1.65;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(ellipse at 82% 12%,rgba(31,130,220,.16),transparent 32%),radial-gradient(ellipse at 8% 45%,rgba(40,205,255,.08),transparent 28%),linear-gradient(150deg,#071426,#08172a 60%,#06111f)}
    a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.container{width:min(var(--max),calc(100% - 40px));margin:auto}
    .nav-wrap{position:sticky;top:0;z-index:20;background:rgba(7,20,38,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;font-family:Manrope,sans-serif;font-weight:800;letter-spacing:.03em}.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;color:#071426;background:linear-gradient(145deg,#9df0ff,#52a9ff);box-shadow:0 8px 30px #4cbaff33}.brand small{display:block;font-size:10px;letter-spacing:.22em;color:#94b9da;font-weight:600;margin-top:-4px}.nav-links{display:flex;gap:26px;align-items:center;color:#c1d0e1;font-size:13px}.nav-links a:hover{color:var(--cyan)}.nav-cta,.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:13px;transition:.25s ease;border:1px solid transparent;cursor:pointer}.nav-cta,.btn-primary{background:linear-gradient(135deg,#8ceaff,#579fff);color:#071426;box-shadow:0 10px 28px #4cbaff22}.btn:hover,.nav-cta:hover{transform:translateY(-2px);box-shadow:0 15px 35px #4cbaff35}.btn-outline{border-color:var(--line);color:#e4f0ff;background:rgba(255,255,255,.025)}.menu-btn{display:none;background:none;border:1px solid var(--line);color:white;border-radius:10px;padding:9px 12px}
    .hero{padding:92px 0 72px;position:relative}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:44px}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:#69e9c0;box-shadow:0 0 15px #69e9c0}.hero h1{font-family:Manrope,sans-serif;font-size:clamp(42px,5.5vw,70px);line-height:1.06;letter-spacing:-.055em;margin:20px 0}.gradient-text{background:linear-gradient(100deg,#fff 8%,#7bdfff 48%,#72a7ff 90%);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:550px;font-size:16px}.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0}.micro-proof{display:flex;gap:16px;align-items:center;color:#a8bbd0;font-size:12px}.micro-proof strong{color:#fff}.hero-art{position:relative;min-height:470px;display:grid;place-items:center;perspective:1000px}.orb{position:absolute;border-radius:50%;filter:blur(1px);animation:float 7s ease-in-out infinite}.orb.one{width:280px;height:280px;background:radial-gradient(circle at 28% 22%,#d3faff 0,#70dfff 10%,#2c87dd 34%,#122c60 68%,#071426 76%);box-shadow:inset -25px -30px 50px #020b1d,0 25px 85px #178eea35;transform:translate(30px,-25px)}.orb.two{width:115px;height:115px;right:9%;top:15%;background:radial-gradient(circle at 30% 25%,#fff,#a7f2ff 10%,#4a9bff 43%,#17285a 75%);box-shadow:inset -12px -16px 24px #061127,0 15px 50px #50b8ff55;animation-delay:-2s}.orb.three{width:75px;height:75px;left:10%;bottom:16%;background:radial-gradient(circle at 30% 25%,#fff,#7deaff 15%,#3475c8 65%,#0a1932 85%);animation-delay:-4s}.ring{position:absolute;width:390px;height:390px;border:1px solid #7edfff42;border-radius:50%;transform:rotateX(66deg) rotateZ(-25deg);box-shadow:0 0 45px #3dafff0c}.ring:after{content:"";position:absolute;inset:27px;border:1px dashed #7edfff38;border-radius:50%}.floating-card{position:absolute;ba }
